name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend Validation & Tests ───────────────────────────────────────────
  backend-ci:
    name: Backend (Python & Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_test_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Syntax & Import Check
        run: |
          python -c "import app.main; print('FastAPI App loaded successfully')"

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://erp_user:erp_password@localhost:5432/erp_test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key-1234567890abcdef
          APP_ENV: testing
          EMAIL_PROVIDER: console
        run: |
          pytest -v

      # ── Schema-drift gate ─────────────────────────────────────────────────
      # Applies all pending Alembic migrations to the CI database, then
      # compares the live schema against the ORM metadata.  A non-empty diff
      # means a developer changed a model without writing a migration — fail fast.
      - name: Install psycopg2 (sync driver for drift check)
        run: pip install psycopg2-binary==2.9.10

      - name: Run Schema Drift Check
        env:
          # Sync URL — psycopg2 dialect required by Alembic autogenerate
          DATABASE_URL: postgresql+psycopg2://erp_user:erp_password@localhost:5432/erp_test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key-1234567890abcdef
          APP_ENV: testing
          EMAIL_PROVIDER: console
        run: |
          python scripts/check_schema_drift.py

  # ─── Frontend Validation & Tests ──────────────────────────────────────────
  frontend-ci:
    name: Frontend (Next.js & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: fontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Next.js Linting
        run: npm run lint
        continue-on-error: true

      - name: Run Vitest Suite
        run: npm run test

      - name: Run Next.js Build Check
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_ROOT_DOMAIN: xyz.com
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ─── Docker Container Build Verification ──────────────────────────────────
  docker-ci:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: erp-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./fontend
          file: ./fontend/Dockerfile
          push: false
          tags: erp-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_ROOT_DOMAIN=xyz.com
